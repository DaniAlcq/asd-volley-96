name: Aggiorna classifiche FIPAV e pubblica il sito

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */3 * * *'
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# Evita che due esecuzioni di QUESTO workflow scrivano insieme sul repository.
concurrency:
  group: volley96-fipav-main
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa le librerie
        run: python -m pip install -r scripts/requirements.txt

      - name: Aggiorna e salva classifiche e calendari senza conflitti
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="${GITHUB_REF_NAME:-main}"
          pubblicato=false

          # In caso di nuovo commit remoto, si riparte dall'ultimo main e
          # si RIGENERANO i dati: non si esegue MAI un rebase su JSON generati.
          for attempt in 1 2 3 4 5; do
            echo "Aggiornamento, tentativo $attempt/5"
            git fetch origin "$branch"
            git reset --hard "origin/$branch"

            # Un problema temporaneo FIPAV non elimina i JSON gia' archiviati.
            if ! python scripts/aggiorna_classifiche.py; then
              echo '::warning::Recupero classifiche parziale o non riuscito: dati gia presenti conservati.'
            fi
            if ! python scripts/aggiorna_calendari.py; then
              echo '::warning::Recupero calendari parziale o non riuscito: dati gia presenti conservati.'
            fi

            # Non pubblicare un sito privo dei dati delle stagioni attive.
            python - <<'PY'
          import json
          from pathlib import Path
          import sys
          config = json.loads(Path('data/stagioni.json').read_text(encoding='utf-8'))
          errors = []
          for season in config.get('stagioni', []):
              if season.get('stato') != 'attiva':
                  continue
              for root in ('classifiche', 'calendari'):
                  for category in ('femminile', 'maschile'):
                      path = Path('data') / root / season['id'] / (category + '.json')
                      if not path.is_file():
                          errors.append(str(path) + ' mancante')
                          continue
                      try:
                          obj = json.loads(path.read_text(encoding='utf-8'))
                          count = len(obj.get('dati', []))
                          if count == 0:
                              errors.append(str(path) + ' vuoto')
                          else:
                              print(f'{path}: {count} righe')
                      except (ValueError, TypeError) as exc:
                          errors.append(str(path) + ': ' + str(exc))
          for error in errors:
              print('::error::' + error)
          if errors:
              sys.exit(1)
          PY

            for directory in data/classifiche data/calendari img/loghi-fipav; do
              if [ -d "$directory" ]; then git add -A -- "$directory"; fi
            done

            if git diff --cached --quiet; then
              echo 'Nessuna modifica ai JSON da salvare.'
              pubblicato=true
              break
            fi

            git commit -m 'Aggiorna classifiche e calendari FIPAV'
            if git push origin "HEAD:$branch"; then
              echo 'Dati salvati nel repository.'
              pubblicato=true
              break
            fi
            echo '::warning::Branch aggiornato da un altro processo, ritento da origin/main senza rebase.'
            sleep 5
          done

          if [ "$pubblicato" != true ]; then
            echo '::error::Impossibile salvare i dati dopo 5 tentativi: verificare workflow duplicati e permessi.'
            exit 1
          fi

      - name: Prepara la versione pubblica
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='scripts/' \
            --exclude='*.php' \
            --exclude='*.zip' \
            --exclude='README.md' \
            ./ _site/

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

      - name: Pubblica GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
