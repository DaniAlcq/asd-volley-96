name: Aggiorna classifiche FIPAV e pubblica il sito

on:
  workflow_dispatch:
  # Ogni 3 ore circa (orario UTC; gli avvii possono subire ritardi).
  schedule:
    - cron: '37 */3 * * *'
  # Pubblica anche quando modifichi il sito direttamente nel repository.
  push:
    branches: [main, master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa le librerie
        run: python -m pip install -r scripts/requirements.txt

      - name: Recupera classifiche FIPAV
        id: recupero
        continue-on-error: true
        run: python scripts/aggiorna_classifiche.py

      - name: Salva i JSON aggiornati nel repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/classifica-femminile.json data/classifica-maschile.json
          if [ -d img/loghi-fipav ]; then git add img/loghi-fipav/; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiornamento automatico classifiche FIPAV'
            git push
          fi

      - name: Prepara i file pubblici del sito
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='scripts/' \
            --exclude='*.php' \
            --exclude='*.zip' \
            --exclude='README.md' \
            ./ _site/

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica i file per GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

      - name: Pubblica GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Segnala se FIPAV non era raggiungibile
        if: steps.recupero.outcome == 'failure'
        run: |
          echo 'Il sito è stato pubblicato con gli ultimi JSON disponibili, ma il recupero FIPAV non è riuscito.'
          exit 1
